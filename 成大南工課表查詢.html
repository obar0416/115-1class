<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成大南工課表查詢</title>
<style>
:root{
  --paper:#EEF2F4; --sheet:#FBFCFC; --ink:#14283A; --ink-2:#4A6072;
  --line:#B9C6CF; --rule:#14283A; --steel:#1F5A86; --steel-ink:#FFFFFF;
  --shop:#DCE8F1; --mute:#E6EAED; --mark:#D99A00;
  --zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --num:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",var(--zh);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1C27; --sheet:#152633; --ink:#E6EEF3; --ink-2:#9DB2C0;
    --line:#31485A; --rule:#C9D6DE; --steel:#7DB7E0; --steel-ink:#0F1C27;
    --shop:#1D3B52; --mute:#1B2D3A; --mark:#F2C230;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1C27; --sheet:#152633; --ink:#E6EEF3; --ink-2:#9DB2C0;
  --line:#31485A; --rule:#C9D6DE; --steel:#7DB7E0; --steel-ink:#0F1C27;
  --shop:#1D3B52; --mute:#1B2D3A; --mark:#F2C230;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 48px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* 頁首 */
.masthead h1{margin:0;font-size:clamp(1.75rem,5.2vw,2.75rem);line-height:1.15;font-weight:800;letter-spacing:.02em}
.masthead p{margin:8px 0 0;color:var(--ink-2);font-size:.95rem}

/* 查詢方式 */
.modes{display:inline-flex;margin-top:22px;border:2px solid var(--rule)}
.modes button{appearance:none;border:0;background:transparent;padding:9px 22px;font-weight:700;cursor:pointer}
.modes button + button{border-left:2px solid var(--rule)}
.modes button[aria-selected="true"]{background:var(--rule);color:var(--sheet)}

.picker{margin-top:14px}
.groups{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:10px}
.groups button{appearance:none;border:0;border-bottom:3px solid transparent;background:none;padding:6px 0;cursor:pointer;color:var(--ink-2);font-weight:600}
.groups button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--steel)}
.search{display:block;width:100%;max-width:340px;margin-bottom:10px;padding:10px 12px;border:2px solid var(--rule);background:var(--sheet);border-radius:0}
.search::placeholder{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.tall{max-height:216px;overflow-y:auto;padding:2px 2px 2px 0}
.chip{appearance:none;border:1px solid var(--line);background:var(--sheet);padding:6px 11px;cursor:pointer;border-radius:2px;font-size:.95rem}
.chip:hover{border-color:var(--steel)}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--steel-ink);font-weight:700}
.none{color:var(--ink-2);margin:6px 0}

/* 課表圖紙 */
.sheet{margin-top:26px;background:var(--sheet);border:2px solid var(--rule)}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;padding:16px 16px 12px}
.sheet-head h2{margin:0;font-size:1.6rem;line-height:1.2;font-weight:800}
.sheet-head .kind{color:var(--ink-2);font-size:.95rem;margin-left:8px;font-weight:500}
.print{appearance:none;border:1px solid var(--rule);background:transparent;padding:6px 12px;cursor:pointer;border-radius:2px;font-size:.9rem}
.related{padding:0 16px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:.92rem}
.related .lab{color:var(--ink-2)}
.link{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:var(--steel);text-decoration:underline;text-underline-offset:3px;font:inherit}
.empty{padding:36px 16px 40px;color:var(--ink-2)}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:4px}

.scroll{overflow-x:auto;border-top:2px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:600px;table-layout:fixed}
th,td{border:1px solid var(--line);padding:0;vertical-align:top}
thead th{padding:8px 4px;font-weight:700;font-size:.95rem;border-top:0;background:var(--sheet)}
tr > :first-child{border-left:0} tr > :last-child{border-right:0}
tbody tr:last-child > *{border-bottom:0}
th.per{width:58px;position:sticky;left:0;z-index:1;background:var(--sheet);font-family:var(--num);font-size:1.5rem;font-weight:600;line-height:1;vertical-align:middle;text-align:center;border-right:2px solid var(--rule)}
thead th:first-child{width:58px;position:sticky;left:0;z-index:1;border-right:2px solid var(--rule);font-size:.8rem;color:var(--ink-2);font-weight:500}
tr.noon > *{border-top:2px solid var(--rule)}
td{height:74px}
.per b{display:block;font-weight:600}
.per small{display:block;margin-top:4px;font-family:var(--num);font-size:.68rem;font-weight:400;line-height:1.25;color:var(--ink-2)}
.slot{padding:7px 8px;min-height:100%;height:100%}
.slot + .slot{border-top:1px dashed var(--ink-2)}
td.shop .slot.shop, td .slot.shop{background:var(--shop)}
.slot.act{background:var(--mute);color:var(--ink-2)}
.subj{font-weight:700;font-size:.93rem;line-height:1.3;word-break:break-all}
.who{margin-top:3px;font-size:.86rem;line-height:1.35}
.who .link{font-size:inherit}
.note{margin-top:2px;font-size:.78rem;color:var(--ink-2)}
td.split{height:auto}
td.split .slot{min-height:60px;height:auto}

/* 圖例與標題欄 */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:12px 16px;border-top:2px solid var(--rule);font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:14px;border:1px solid var(--line);display:inline-block}
.sw.shop{background:var(--shop)} .sw.act{background:var(--mute)}
.sw.split{background:linear-gradient(var(--sheet) 45%,var(--ink-2) 45%,var(--ink-2) 55%,var(--sheet) 55%)}
.titleblock{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;border-top:2px solid var(--rule)}
.titleblock div{padding:8px 12px 10px;border-left:1px solid var(--line);min-width:0}
.titleblock div:first-child{border-left:0}
.titleblock dt{font-size:.72rem;color:var(--ink-2)}
.titleblock dd{margin:1px 0 0;font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.titleblock dd.n{font-family:var(--num);font-size:1.1rem;letter-spacing:.02em}
dl{margin:0}
.hint{display:none;padding:0 16px 10px;font-size:.82rem;color:var(--ink-2)}
footer{margin-top:18px;color:var(--ink-2);font-size:.85rem;max-width:68ch}

@media (max-width:560px){
  .wrap{padding:20px 12px 40px}
  .titleblock{grid-template-columns:1fr 1fr}
  .titleblock div:nth-child(3){border-left:0}
  .titleblock div:nth-child(n+3){border-top:1px solid var(--line)}
  .modes button{padding:9px 18px}
  .hint{display:block}
  table{min-width:560px}
}
@media print{
  :root{--paper:#fff;--sheet:#fff;--ink:#000;--ink-2:#333;--line:#888;--rule:#000;--steel:#000;--shop:#e6e6e6;--mute:#f1f1f1}
  body{background:#fff}
  .masthead p,.modes,.picker,.print,.hint,footer{display:none}
  .masthead h1{font-size:1.1rem}
  .wrap{max-width:none;padding:0}
  .sheet{margin-top:8px}
  .scroll{overflow:visible} table{min-width:0}
  .link{color:#000;text-decoration:none}
  td{height:62px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

</div>

      const b = el('button', 'chip', c.n);
      b.setAttribute('aria-pressed', String(state.mode === 'c' && state.id === i));
      b.onclick = () => show('c', i);
      box.appendChild(b);
    });
  }

  // ── 教師選單 ──
  function drawTeacherChips(){
    const box = $('teacher-chips'); box.textContent = '';
    const q = $('q').value.trim().toLowerCase();
    let n = 0;
    for (const i of teacherOrder) {
      if (q && !teachers[i].toLowerCase().includes(q)) continue;
      const b = el('button', 'chip', teachers[i]);
      b.setAttribute('aria-pressed', String(state.mode === 't' && state.id === i));
      b.onclick = () => show('t', i);
      box.appendChild(b); n++;
    }
    if (!n) box.appendChild(el('p', 'none', '找不到「' + $('q').value.trim() + '」，請確認姓名或只輸入其中一個字。'));
  }
  $('q').addEventListener('input', drawTeacherChips);

  function setMode(m){
    state.mode = m;
    $('mode-c').setAttribute('aria-selected', String(m === 'c'));
    $('mode-t').setAttribute('aria-selected', String(m === 't'));
    $('pick-c').hidden = m !== 'c';
    $('pick-t').hidden = m !== 't';
  }
  $('mode-c').onclick = () => { setMode('c'); state.id = null; refresh(); };
  $('mode-t').onclick = () => { setMode('t'); state.id = null; refresh(); };

  function linkTo(mode, id, label){
    const b = el('button', 'link', label);
    b.onclick = () => show(mode, id, true);
    return b;
  }

  // ── 課表 ──
  function drawSheet(){
    const sheet = $('sheet'); sheet.textContent = '';
    if (state.id == null) {
      const e = el('div', 'empty');
      e.appendChild(el('strong', null, state.mode === 'c' ? '選一個班級，查看整週課表' : '選一位教師，查看整週課表'));
      e.appendChild(document.createTextNode(state.mode === 'c' ? '先選年級，再點班級名稱。' : '可以直接輸入姓名，或從名單中點選。'));
      sheet.appendChild(e);
      return;
    }
    const isClass = state.mode === 'c';
    const name = isClass ? classes[state.id].n : teachers[state.id];
    const grid = isClass ? byClass[state.id] : byTeacher[state.id];
    const hasFixed = isClass ? classes[state.id].g < 3 : true;

    const head = el('div', 'sheet-head');
    const h2 = el('h2', null, name);
    h2.appendChild(el('span', 'kind', isClass ? '班級課表' : '教師課表'));
    head.appendChild(h2);
    const pr = el('button', 'print', '列印這張課表');
    pr.onclick = () => window.print();
    head.appendChild(pr);
    sheet.appendChild(head);

    // 相關連結：班級 → 任課教師；教師 → 任教班級
    const rel = new Map();
    Object.values(grid).forEach(list => list.forEach(x => {
      const id = isClass ? x.t : x.c;
      if (id >= 0) rel.set(id, (rel.get(id) || 0) + 1);
    }));
    const slots = Object.keys(grid).length;
    const related = el('div', 'related');
    if (!isClass && roles[state.id]) related.appendChild(el('span', null, roles[state.id]));
    if (isClass && classes[state.id].h >= 0) {
      related.appendChild(el('span', 'lab', '導師'));
      related.appendChild(linkTo('t', classes[state.id].h, teachers[classes[state.id].h]));
    }
    related.appendChild(el('span', null, isClass ? '每週 ' + slots + ' 節課' : '每週授課 ' + slots + ' 節'));
    if (rel.size) {
      related.appendChild(el('span', 'lab', isClass ? '任課教師' : '任教班級'));
      const ids = [...rel.keys()].sort((a, b) => isClass ? collator.compare(teachers[a], teachers[b]) : a - b);
      ids.forEach(id => related.appendChild(linkTo(isClass ? 't' : 'c', id, isClass ? teachers[id] : classes[id].n)));
    }
    sheet.appendChild(related);
    sheet.appendChild(el('div', 'hint', '左右滑動可以看到整週課表。'));

    const scroll = el('div', 'scroll');
    const table = el('table');
    const thead = el('thead'); const hr = el('tr');
    hr.appendChild(el('th', null, '節'));
    DAYS.forEach(d => { const th = el('th', null, d); th.scope = 'col'; hr.appendChild(th); });
    thead.appendChild(hr); table.appendChild(thead);
    const tbody = el('tbody');
    for (let p = 1; p <= PERIODS; p++) {
      const tr = el('tr', p === 5 ? 'noon' : null);
      const th = el('th', 'per'); th.scope = 'row';
      const t = meta.times[p - 1];
      th.setAttribute('aria-label', '第 ' + p + ' 節 ' + t[0] + ' 到 ' + t[1]);
      th.appendChild(el('b', null, String(p)));
      const sm = el('small'); sm.appendChild(document.createTextNode(t[0])); sm.appendChild(el('br')); sm.appendChild(document.createTextNode(t[1])); th.appendChild(sm);
      tr.appendChild(th);
      for (let d = 1; d <= 5; d++) {
        const td = el('td');
        const list = grid[d + '-' + p];
        if (list) fillCell(td, list, d, p, isClass);
        else if (hasFixed && meta.fixed.some(f => f[0] === d && f[1] === p)) {
          const slot = el('div', 'slot act'); slot.appendChild(el('div', 'subj', meta.fixedLabel)); td.appendChild(slot);
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody); scroll.appendChild(table); sheet.appendChild(scroll);

    const lg = el('div', 'legend');
    [['shop', '實習、實作、實務課'], ['split', '同一節分組上課'], ['act', meta.fixedLabel]].forEach(([c, t]) => {
      const s = el('span'); s.appendChild(el('i', 'sw ' + c)); s.appendChild(document.createTextNode(t)); lg.appendChild(s);
    });
    sheet.appendChild(lg);

    const tb = el('dl', 'titleblock');
    [['學校', meta.school, ''], ['表名', name + (isClass ? ' 班級課表' : ' 教師課表'), ''], ['學期', meta.termShort, 'n'], ['資料版本', meta.dataDate, 'n']].forEach(([k, v, c]) => {
      const d = el('div'); d.appendChild(el('dt', null, k)); d.appendChild(el('dd', c, v)); tb.appendChild(d);
    });
    sheet.appendChild(tb);
  }

  function fillCell(td, list, d, p, isClass){
    // 把同科目的多位教師合併成一格；不同科目視為分組
    const bySubj = new Map();
    list.forEach(x => { if (!bySubj.has(x.s)) bySubj.set(x.s, []); bySubj.get(x.s).push(x); });
    if (bySubj.size > 1) td.className = 'split';
    bySubj.forEach((items, s) => {
      const sn = subjects[s];
      const slot = el('div', 'slot' + (SHOP.test(sn) ? ' shop' : '') + (sn === '團體活動時間' ? ' act' : ''));
      slot.appendChild(el('div', 'subj', sn));
      const who = el('div', 'who');
      items.forEach((x, i) => {
        const id = isClass ? x.t : x.c;
        if (id < 0) return;
        if (who.childNodes.length) who.appendChild(document.createTextNode('、'));
        who.appendChild(linkTo(isClass ? 't' : 'c', id, isClass ? teachers[id] : classes[id].n));
      });
      if (who.childNodes.length) slot.appendChild(who);
      if (!isClass) {
        // 教師課表：標出同一節、同一班的其他教師
        const same = new Set(), diff = new Set();
        items.forEach(x => (byClass[x.c][d + '-' + p] || []).forEach(o => {
          if (o.t < 0 || o.t === state.id) return;
          (o.s === x.s ? same : diff).add(teachers[o.t]);
        }));
        if (same.size) slot.appendChild(el('div', 'note', '與' + [...same].join('、') + '同上'));
        if (diff.size) slot.appendChild(el('div', 'note', '分組，其他組：' + [...diff].join('、')));
      }
      td.appendChild(slot);
    });
  }

  function refresh(){
    drawGroups(); drawClassChips(); drawTeacherChips(); drawSheet();
    try {
      const h = state.id == null ? '' : '#' + (state.mode === 'c' ? '班級/' + classes[state.id].n : '教師/' + teachers[state.id]);
      history.replaceState(null, '', h || location.pathname + location.search);
    } catch (e) {}
    document.title = (state.id == null ? '' : (state.mode === 'c' ? classes[state.id].n : teachers[state.id]) + '｜') + '成大南工課表查詢';
  }

  function show(mode, id, jump){
    setMode(mode); state.id = id;
    if (mode === 'c') state.group = classes[id].g;
    if (mode === 't' && jump) $('q').value = '';
    refresh();
    if (jump) { try { $('sheet').scrollIntoView({block: 'start'}); } catch (e) {} }
  }

  // 網址可直接指定：#班級/機械一甲、#教師/姓名
  function fromHash(){
    let h = '';
    try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    const m = h.match(/^(班級|教師)\/(.+)$/);
    if (!m) return false;
    const i = m[1] === '班級' ? classes.findIndex(c => c.n === m[2]) : teachers.indexOf(m[2]);
    if (i < 0) return false;
    show(m[1] === '班級' ? 'c' : 't', i);
    return true;
  }
  if (!fromHash()) refresh();
  window.addEventListener('hashchange', fromHash);
})();
</script>
</body>
</html>
